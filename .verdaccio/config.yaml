# Local-only registry config for testing layer changes in external consumers.
# Bound to loopback, and publishing @incubrain/* needs a login: the publish
# script (layer/scripts/publish-local.sh) registers a throwaway 'foundry-local'
# user on first run, so devs never run `npm adduser` by hand. Only @incubrain/*
# packages stay local; everything else proxies to public npm.
storage: ./.verdaccio/storage
auth:
  htpasswd:
    file: ./.verdaccio/htpasswd
    max_users: 10
listen: 127.0.0.1:4873

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@incubrain/*':
    access: $all
    # Authenticated only, so no other process can plant an @incubrain build
    # that consumers then install as if it came from this repo.
    publish: $authenticated
    unpublish: $authenticated
    # Don't proxy to public npm for our scoped packages — local versions win.
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

log:
  type: stdout
  format: pretty
  level: warn

# Pid file location so `verdaccio:stop` can find it.
self_path: ./

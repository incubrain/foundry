      children:
        - label: Blog
          to: /blog
        - label: Source (GitHub)
          icon: i-simple-icons-github
          to: https://github.com/incubrain/foundry
          target: _blank
        - label: npm — @incubrain/foundry
          icon: i-lucide-package
          to: https://www.npmjs.com/package/@incubrain/foundry
          target: _blank
    - label: For agents
      children:
        - label: llms.txt
          to: /llms.txt
        - label: sitemap.xml
          to: /sitemap.xml
  bottom: []

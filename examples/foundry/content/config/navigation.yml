# Navigation Configuration
# One-page station: anchors only, no banner, no legacy routes.

header:
  title: Foundry
  socials:
    x: https://x.com/DrewMacGibbon
    github: https://github.com/incubrain/foundry
  navigation:
    - label: The Reading
      to: /#reading
    - label: The Loop
      to: /#loop
    - label: Live Tail
      to: /#live
    - label: Station Log
      to: /#ledger
  showSearch: false
  showColorMode: false

footer:
  columns:
